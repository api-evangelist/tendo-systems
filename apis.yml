aid: tendo-systems
name: Tendo Systems
description: >-
  Tendo (Tendo Systems) is a healthcare technology company founded in 2020 by
  siblings Dan and Jen Goldsmith, building software, analytics, and healthcare
  marketplaces on a next-generation platform that connects patients, clinicians,
  and providers across the fragmented care experience. Its application suite
  spans Tendo Insights (clinical quality and financial analytics), Tendo QDI
  (clinical documentation integrity and workflow optimization), Tendo Outreach
  (targeted patient engagement), and Care Connect, a shoppable bundled-procedure
  marketplace built on its 2023 acquisition of MDsave. Tendo does not currently
  publish a public developer API, OpenAPI specification, or open developer
  portal; its documentation and support portals are gated behind authentication.
  This API Evangelist profile captures the company's public identity and
  security posture.
